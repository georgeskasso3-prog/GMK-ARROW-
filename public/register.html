<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMK ARROW</title>
<style>
body { margin:0; font-family: Arial; background:#0A1931; color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.card { background:#102542; border:2px solid #D4AF37; border-radius:20px; padding:25px; width:360px; text-align:center; }
.logo-img { width:180px; margin:0 auto 10px; display:block; }
.title { font-size:28px; font-weight:900; color:#D4AF37; }
.slogan { color:white; font-size:13px; margin:5px 0; }
.slogan2 { color:#D4AF37; font-size:11px; font-style:italic; margin-bottom:18px; }
input { width:100%; padding:13px; background:#0A1931; color:white; border:1px solid #555; border-radius:8px; margin:6px 0; box-sizing:border-box; }
.box { position:relative; }
.eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:18px; }
button { width:100%; padding:13px; background:#D4AF37; color:#0A1931; border:none; border-radius:8px; font-weight:900; cursor:pointer; margin-top:10px; }
a { color:#D4AF37; text-decoration:none; font-size:13px; }
</style>
</head>
<body>
<div class="card">
<img src="/logo.png" class="logo-img">
<div class="title">GMK-ARROW-</div>
<div class="slogan">La Vision Nouvelle de la Communication Communautaire</div>
<div class="slogan2">Rejoignez le mouvement</div>
<input type="text" id="nom" placeholder="Nom complet">
<input type="email" id="email" placeholder="Email">
<div class="box">
<input type="password" id="pass" placeholder="Mot de passe">
<span class="eye" id="eye" onclick="toggleEye()">👁️</span>
</div>
<input type="tel" id="tel" placeholder="Téléphone">

<button onclick="inscrire()">CRÉER MON COMPTE →</button>
<br><br>
<p style="margin-top:15px"><a href="/login.html">Déjà inscrit? Se connecter →</a></p>
</div>
<script>
function toggleEye(){
 const p=document.getElementById('pass');
 const e=document.getElementById('eye');
 if(p.type==='password'){p.type='text'; e.textContent='🙈';}
 else{p.type='password'; e.textContent='👁️';}
}
async function inscrire(){
 const data={
  nom:document.getElementById('nom').value,
  email:document.getElementById('email').value,
  password:document.getElementById('pass').value,
  telephone:document.getElementById('tel').value
 };
 if(!data.nom || !data.email || !data.password){alert('Remplis tout Chef!'); return;}
 try{
  const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const result=await res.json();
  if(res.ok){
alert('Compte créé! Connecte-toi maintenant Chef!');
   window.location.href="/login.html";
  } else { alert(result.error || 'Erreur'); }
 } catch(err){ alert('Erreur serveur'); }
}
</script>
</body>
</html>
