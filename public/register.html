<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMK ARROW</title>
<style>
body { margin:0; font-family: Arial; background:#0A1931; color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.card { background:#102542; border:2px solid #D4AF37; border-radius:20px; padding:25px; width:360px; text-align:center; }
.logo-img { width:180px; margin:0 auto 10px; display:block; }
.title { font-size:28px; font-weight:900; color:#D4AF37; }
.slogan { color:white; font-size:13px; margin:5px 0; }
.slogan2 { color:#D4AF37; font-size:11px; font-style:italic; margin-bottom:18px; }
input { width:100%; padding:13px; background:#0A1931; color:white; border:1px solid #555; border-radius:10px; margin:6px 0; box-sizing:border-box; font-size:15px; }
.box { position:relative; }
.eye { position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:22px; }
button { width:100%; padding:13px; background:#D4AF37; color:#0A1931; border:none; border-radius:10px; font-weight:bold; cursor:pointer; margin-top:8px; font-size:15px; }
a { color:#D4AF37; text-decoration:none; font-size:13px; }
</style>
</head>
<body>
<div class="card">
<img src="logo.png" class="logo-img">
<div class="title">GMK ARROW</div>
<div class="slogan">La Nouvelle vision de la communication communautaire</div>
<div class="slogan2">ensemble, nous irons plus loin!</div>

<input id="nom" placeholder="Nom complet">
<input id="email" type="email" placeholder="Email">
<input id="tel" type="tel" placeholder="Téléphone">

<div class="box">
<input type="password" id="pass" placeholder="Mot de passe">
<span class="eye" id="eye" onclick="toggleEye()">👁️</span>
</div>
  <button onclick="inscrire()">CRÉER MON COMPTE ➤</button>
<br><br>
<a href="/comptes.html">Voir les comptes →</a>
</div>

<script>
function toggleEye(){
 const p=document.getElementById('pass');
 const e=document.getElementById('eye');
 if(p.type==='password'){p.type='text'; e.textContent='🙈';}
 else{p.type='password'; e.textContent='👁️';}
}
async function inscrire(){
 const data={
   nom:document.getElementById('nom').value,
   email:document.getElementById('email').value,
   tel:document.getElementById('tel').value,
   pass:document.getElementById('pass').value,
   date:new Date().toLocaleString()
 };
  if(!data.nom||!data.email||!data.pass){alert('Remplis tout Chef!'); return;}
 await fetch('/api/membres',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 alert('Compte créé Chef! Bienvenue!');
 location.href='/feed.html';
}
</script>
</body>
</html>
