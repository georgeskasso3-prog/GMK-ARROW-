<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GMK ARROW</title>
<style>
body { margin:0; font-family: Arial; background:#0A1931; color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.card { background:#102542; border:2px solid #D4AF37; border-radius:20px; padding:25px; width:360px; text-align:center; box-shadow:0 0 30px #000; }
.logo-img { width:180px; margin:0 auto 10px; display:block; }
.title { font-size:28px; font-weight:900; color:#D4AF37; }
.slogan { color:white; font-size:13px; margin:5px 0; }
.slogan2 { color:#D4AF37; font-size:11px; font-style:italic; margin-bottom:18px; }input { width:100%; padding:12px; margin:7px 0; border-radius:8px; border:1px solid #1e3a5f; background:#0A1931; color:white; box-sizing:border-box; }
button { width:100%; padding:13px; background:#D4AF37; color:#0A1931; border:none; border-radius:8px; font-weight:900; font-size:16px; cursor:pointer; margin-top:10px; }
a { color:#D4AF37; text-decoration:none; font-size:13px; }
</style>
</head>
<body>
<div class="card"><img src="/logo.png" class="logo-img">
<div class="title">GMK ARROW</div>
<div class="slogan">La Nouvelle vision de la communication communautaire</div>
<div class="slogan2">ensemble, nous irons plus loin!</div>
<form method="POST" action="/register">
<input name="name" placeholder="Nom complet" required>
<input name="email" type="email" placeholder="Email" required>
<input name="telephone" placeholder="Téléphone" required>
<input name="password" type="password" placeholder="Mot de passe" required>
<button type="submit">CRÉER MON COMPTE ➤</button>
</form>
<div style="margin-top:12px;"><a href="/users">Voir les comptes →</a></div>
</div>
</body>
</html>
