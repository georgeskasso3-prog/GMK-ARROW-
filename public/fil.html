<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fil GMK V4.2.3 FIX</title>
<style>
body{background:#0a1931;color:#FFD700;font-family:Arial;padding:12px;margin:0}
.top{background:#000;padding:12px;border-radius:10px;display:flex;justify-content:space-between;margin-bottom:12px}
.box{background:#0f274e;border:2px solid #FFD700;border-radius:15px;padding:15px}
textarea{width:100%;height:85px;background:#000;color:#fff;border:1px solid #FFD700;border-radius:10px;padding:12px;font-size:16px;box-sizing:border-box}
button{padding:13px;border:none;border-radius:25px;font-weight:bold;font-size:14px;margin:4px;width:47%;cursor:pointer}
#pub{background:#FFD700;color:#000;width:100%;font-size:18px;padding:16px;margin-top:12px}
.post{background:#000;border:1px solid 
#FFD700;border-radius:10px;padding:10px;margin-top:12px}
</style>
</head>
<body>
<div class="top"><span>← GMK</span><span>Fil GMK V4.2.3 FIX ✅<br><small style="background:#00c853;color:#fff;padding:2px 6px;border-radius:8px">SYNC OK</small></span><span id="c">0 posts</span></div>
<div class="box">
<textarea id="t" placeholder="Quoi de neuf Chef?"></textarea>
<div style="display:flex;flex-wrap:wrap">
<button style="background:#FFD700" onclick="f.click()">📷 Photo</button>
<button style="background:#00c853;color:#fff" onclick="f.click()">🎥 Caméra</button>
<button style="background:#fff" onclick="f.click()">🎞️ Vidéo</button>
<button style="background:#FFD700" onclick="alert('Vocal V4.3')">🎤 Vocal</button>
</div>
<input type="file" id="f" accept="image/*,video/*" style="display:none" onchange="hf(this)">
<div id="pv"></div>
<button id="pub" onclick="pub()">🚀 Publier sur CLOUD</button>
</div>
<div id="feed"></div>
<script>
let md=null;
function hf(i){let file=i.files[0];if(!file)return;let r=new FileReader();r.onload=e=>{md=e.target.result;document.getElementById('pv').innerHTML='<img src="'+md+'" style="max-width:100%;border-radius:10px;margin-top:8px">';};r.readAsDataURL(file);}
function pub(){let txt=document.getElementById('t').value.trim();if(!txt&&!md){alert('Écris quelque chose Chef!');return;}let post={texte:txt,media:md,date:new Date().toISOString()};let posts=JSON.parse(localStorage.getItem('gmk_posts')||'[]');posts.unshift(post);localStorage.setItem('gmk_posts',JSON.stringify(posts));document.getE
lementById('t').value='';document.getElementById('pv').innerHTML='';md=null;aff();alert('✅ Publié Chef!');}
function aff(){let posts=JSON.parse(localStorage.getItem('gmk_posts')||'[]');document.getElementById('c').innerText=posts.length+' posts';let feed=document.getElementById('feed');feed.innerHTML='';posts.forEach((p,i)=>{let d=document.createElement('div');d.className='post';d.innerHTML='<div>'+(p.texte||'')+'</div>'+(p.media?'<img src="'+p.media+'" style="max-width:100%;margin-top:8px;border-radius:8px">':'')+'<div style="font-size:11px;color:#aaa;margin-top:5px">'+new Date(p.date).toLocaleString()+'</div><button onclick="supp('+i+')" style="background:#ff4444;color:#fff;padding:5px 10px;border-radius:5px;margin-top:6px;width:auto">🗑️ Supprimer</button>';feed.appendChild(d);});}
function supp(i){if(!confirm('Supprimer ce post?'))return;let 
posts=JSON.parse(localStorage.getItem('gmk_posts')||'[]');posts.splice(i,1);localStorage.setItem('gmk_posts',JSON.stringify(posts));aff();}
aff();
</script>
</body>
</html>
