<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fil GMK V3.7 MAC+PHONE</title>
<style>
body{background:#0a1931;color:white;font-family:Arial;margin:0;padding-bottom:90px}
.header{background:#0a1931;color:#FFD700;padding:12px;display:flex;justify-content:space-between;border-bottom:2px solid #FFD700;position:sticky;top:0;z-index:10}
.header a{color:#FFD700;text-decoration:none}
.post-box{background:#112240;margin:15px;padding:15px;border-radius:16px;border:1px solid #FFD700}
.post-box textarea{width:100%;height:80px;background:#0a1931;color:white;border:1px solid #777;border-radius:10px;padding:12px;box-sizing:border-box;font-size:17px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btns 
button{background:#FFD700;color:#0a1931;border:0;padding:10px 14px;border-radius:99px;font-weight:800;cursor:pointer}
#feed{padding:10px}
.card{background:#112240;border:1px solid #333;border-radius:14px;padding:12px;margin:12px 0}
#msg{text-align:center;padding:8px;color:#FFD700;font-size:13px}
video,img{width:100%;border-radius:12px;margin-top:8px}
.comments p{margin:6px 0}
</style>
</head>
<body>
<div class="header">
<b>⚡ GMK FIL V3.7</b>
  <span>Mac+Phone HONOR</span>
</div>
<div id="msg">Chargement...</div>

<div class="post-box">
  <textarea id="txt" placeholder="Quoi de neuf Chef?"></textarea>
  <div class="btns">
    <button onclick="document.getElementById('photo').click()">📷 Photo</button>
    <button onclick="document.getElementById('cam').click()">🎥 Cam</button>
    <button onclick="startVocal()">🎤 Vocal</button>
<button onclick="publier()" style="background:white">Publier</button>
  </div>
  <input type="file" id="photo" accept="image/*" hidden onchange="handlePhoto(this)">
  <input type="file" id="cam" accept="video/*" capture="environment" hidden onchange="handleVideo(this)">
  <div id="preview"></div>
</div>

<div id="feed"></div>

<script>
let photoData='', vocalData='', videoData='';
let mediaRecorder, chunks=[];

function detectMime(){
  if(MediaRecorder.isTypeSupported('audio/webm')) return 'audio/webm';
  if(MediaRecorder.isTypeSupported('audio/mp4')) return 'audio/mp4';
  return '';
}
function handlePhoto(input){
  const r=new FileReader();
  r.onload=e=>{photoData=e.target.result; document.getElementById('preview').innerHTML='<img src="'+photoData+'">';};
  r.readAsDataURL(input.files[0]);
}
function handleVideo(input){
  const r=new FileReader();
  r.onload=e=>{videoData=e.target.result; document.getElementById('preview').innerHTML='<video src="'+videoData+'" controls></video>';};
  r.readAsDataURL(input.files[0]);
}
function clearPhoto(){photoData=''; videoData=''; document.getElementById('preview').innerHTML='';}
function clearVocal(){vocalData='';}
function clearPreview(){photoData=''; videoData=''; vocalData=''; document.getElementById('preview').innerHTML=''; document.getElementById('msg').innerText='✅ Effacé - prêt!';}
async function startVocal(){
  const mime=detectMime();
  try{
   const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:true}});
    chunks=[]; mediaRecorder=new MediaRecorder(stream, {mimeType:mime});
    mediaRecorder.ondataavailable=e=>chunks.push(e.data);
    mediaRecorder.onstop=()=>{
      const blob=new Blob(chunks,{type:mime});
      const reader=new FileReader();
      reader.onloadend=()=>{vocalData=reader.result; document.getElementById('preview').innerHTML='<audio src="'+vocalData+'" controls></audio>';};
      reader.readAsDataURL(blob);
      stream.getTracks().forEach(t=>t.stop());
    };
     mediaRecorder.start();
    document.getElementById('msg').innerText='🔴 Enregistrement vocal... reclique pour stopper';
    setTimeout(()=>{if(mediaRecorder.state=='recording'){mediaRecorder.stop(); document.getElementById('msg').innerText='✅ Vocal prêt!';}}, 10000);
    if(mediaRecorder.state=='recording'){
      document.getElementById('msg').onclick=()=>{mediaRecorder.stop(); document.getElementById('msg').innerText='✅ Vocal prêt!'; document.getElementById('msg').onclick=null;}
    }
  }catch(e){alert('Micro bloqué sur HONOR: autorise le micro dans Chrome > Paramètres du site');}
}
function publier(){
  const txt=document.getElementById('txt').value;
  if(!txt &&!photoData &&!videoData &&!vocalData) return alert('Écris quelque chose!');
  const div=document.createElement('div'); div.className='card';
  div.innerHTML='<p>'+ (txt||'') +'</p>'
    + (photoData?'<img src="'+photoData+'">':'')
    + (videoData?'<video src="'+videoData+'" controls playsinline></video>':'')
    + (vocalData?'<audio src="'+vocalData+'" controls></audio>':'')
    + '<div style="margin-top:10px;display:flex;gap:12px"><button onclick="doLike(this)">❤️ <span>0</span></button><button onclick="doComment(this)">💬 Commenter</button></div><div class="comments"></div><small style="opacity:.5">'+new Date().toLocaleString()+'</small>';
  var feed=document.getElementById('feed');
  feed.insertBefore(div, feed.firstChild);
  document.getElementById('txt').value='';
  clearPhoto(); clearVocal(); saveFeed();
}
function doLike(el){ var sp=el.querySelector('span'); sp.innerText=parseInt(sp.innerText)+1; saveFeed(); }
function doComment(el){ var t=prompt('Ton commentaire:'); if(!t) return; var box=el.parentElement.parentElement.querySelector('.comments'); var p=document.createElement('p'); p.style.background='#0a1931'; p.style.padding='8px'; p.style.borderRadius='8px'; p.innerText='Toi: '+t; box.appendChild(p); saveFeed(); }

function saveFeed(){ localStorage.setItem('gmk_feed_v37', document.getElementById('feed').innerHTML); }
function loadFeed(){ var s=localStorage.getItem('gmk_feed_v37'); if(s) document.getElementById('feed').innerHTML=s; }

loadFeed();
var mt=detectMime();
document.getElementById('msg').innerText='✅ Mac/Phone détecté: '+(mt||'auto')+' prêt!';
</script>
</body>
</html>
