<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fil GMK V4.8</title>
<style>body{background:#0a1931;color:#FFD700;font-family:Arial;padding:10px;margin:0}.top{background:#000;padding:12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.box{background:#0f274e;border:2px solid #FFD700;border-radius:15px;padding:12px;margin-top:10px}textarea{width:100%;height:80px;background:#000;color:#fff;border:1px solid #FFD700;border-radius:10px;padding:10px;box-sizing:border-box}button{padding:12px 16px;border:none;border-radius:20px;font-weight:bold;margin:4px;cursor:pointer}#btnPub{background:#FFD700;color:#000;width:100%;font-size:18px;padding:14px;margin-top:10px}.post{background:#000;border:1px solid #FFD700;border-radius:10px;padding:10px;margin-top:10px;color:#fff}.pv img{max-width:100%;border-radius:10px;margin-top:10px;border:2px solid #0f0}.pv video{max-                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 width:100%;border-radius:10px;margin-top:10px}</style></head><body>
<div class="top"><b>← GMK</b><b>Fil GMK V4.8 FIX ✅</b><span id="cnt">0 posts</span></div>
<div class="box">
<textarea id="txt" placeholder="Quoi de neuf Chef?"></textarea>
<div style="margin-top:8px">
<button style="background:#FFD700;color:#000" onclick="pickPhoto()">📷 Photo</button>
<button style="background:#00c853;color:#fff" onclick="alert('Caméra arrive V4.9 - utilise Photo pour l instant')">🎥 Caméra</button>
<button style="background:#fff;color:#000" onclick="pickVideo()">🎞️ Vidéo (petite)</button>
<button style="background:#FFD700;color:#000" onclick="alert('Vocal arrive V4.9')">🎤 Vocal</button>
</div>
<input type="file" id="f1" accept="image/*" style="display:none" onchange="onPhoto(this)">
<input type="file" id="f2" accept="video/*" style="display:none" onchange="onVideo(this)">
<div id="pv" class="pv"></div>
<div id="st" style="color:#0f0;font-size:13px;margin-top:5px"></div><button id="btnPub" onclick="publier()">🚀 Publier sur CLOUD</button><div id="msg" style="color:#0f0;margin-top:6px"></div>
</div><div id="feed"></div>
<script>
let curMedia=null,curType=null;
function pickPhoto(){document.getElementById('f1').click();}
function pickVideo(){document.getElementById('f2').click();}
function onPhoto(input){let f=input.files[0];if(!f){return;}document.getElementById('st').textContent='Chargement photo '+f.name+'...';let r=new FileReader();r.onload=function(e){curMedia=e.target.result;curType='image';document.getElementById('pv').innerHTML='<img src="'+curMedia+'"><div style=color:#0f0>✅ Photo prête! Clique Publier!</div>';document.getElementById('st').textContent='Prêt à publier ✅';};r.readAsDataURL(f);}
function onVideo(input){let f=input.files[0];if(!f)return;if(f.size>8000000){alert('Vidéo trop grosse! Choisis < 8Mo');return;}let r=new 
FileReader();r.onload=function(e){curMedia=e.target.result;curType='video';document.getElementById('pv').innerHTML='<video src="'+curMedia+'" controls></video><div style=color:#0f0>✅ Vidéo prête! Clique Publier!</div>';};r.readAsDataURL(f);}
function loadPosts(){try{return JSON.parse(localStorage.getItem('gmk48')||'[]');}catch(e){return [];}}
function savePosts(p){try{localStorage.setItem('gmk48',JSON.stringify(p.slice(0,20)));return true;}catch(e){alert('Stockage plein! Clique X Suppr sur vieux posts');return false;}}
function render(){let posts=loadPosts();document.getElementById('cnt').textContent=posts.length+' posts';let feed=document.getElementById('feed');feed.innerHTML='';posts.forEach(function(p,i){let m='';if(p.media){if(p.type==='image')m='<img src="'+p.media+'" style="max-width:100%;border-radius:8px;margin-top:8px">';else if(p.type==='video')m='<video src="'+p.media+'" controls style="max-width:100%;border-radius:8px;margin-top:8px"></video>';}let 
d=document.createElement('div');d.className='post';d.innerHTML='<div>'+(p.text||'')+'</div>'+m+'<div style="font-size:11px;color:#aaa;margin-top:6px">'+p.date+' <button onclick="delPost('+i+')" style="background:#ff4444;color:#fff;padding:5px 10px;border-radius:10px;margin-left:10px">X Suppr</button></div>';feed.appendChild(d);});}
function delPost(i){let p=loadPosts();p.splice(i,1);savePosts(p);render();}
function publier(){let t=document.getElementById('txt').value.trim();if(!t&&!curMedia){alert('Écris un texte ou choisis une photo!');return;}let posts=loadPosts();posts.unshift({text:t,media:curMedia,type:curType,date:new Date().toLocaleString()});if(savePosts(posts)){document.getElementById('txt').value='';document.getElementById('pv').innerHTML='';document.getElementById('st').textContent='';curMedia=null;curType=null;document.getElementById('msg').textContent='✅ Publié dans le fil!';setTimeout(function(){document.getElementById('msg').textContent='';},
 2000);render();}}
render();
</script></body></html>^
