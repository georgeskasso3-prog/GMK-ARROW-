<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMK ARROW - Carrefour V3.8</title>
<style>
body{background:#0a1931;color:white;font-family:Arial;margin:0;padding:10px}
.header{display:flex;justify-content:space-between;align-items:center;background:#112240;padding:12px;border-radius:15px;border:2px solid #FFD700;margin-bottom:15px}
.profile{display:flex;align-items:center;gap:10px;cursor:pointer}
.avatar{width:55px;height:55px;border-radius:50%;border:2px solid #FFD700;object-fit:cover;background:#0a1931;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info b{font-size:16px}.info 
span{color:#FFD700;font-size:13px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#112240;padding:18px;border-radius:18px;border:1px solid #FFD700;text-align:center;cursor:pointer}
.card b{color:#FFD700;font-size:18px;display:block;margin:8px 0}
.card span{font-size:13px;opacity:0.9}
.badge{background:#FFD700;color:black;padding:5px 10px;border-radius:15px;font-size:11px;font-weight:bold;margin-top:10px;display:inline-block}
input{display:none}
</style>
</head>
<body>
<div class="header">
<div class="profile" onclick="document.getElementById('pfile').click()">
<div class="avatar" id="avatar">👤</div>
<div class="info"><b id="pname">Chef</b><span>Connecté</span><small style="color:#aaa;font-size:10px">Clique pour photo</small></div>
</div>
<b style="color:#FFD700">GMK ARROW</b>
<input type="file" id="pfile" accept="image/*" onchange="saveProfile(this)">
</div>
<div class="grid">
<div class="card" onclick="location.href='gmk-coach.html'"><div style="font-size:24px">🎯</div><b>GMK COACH</b><span>Coaching IA</span><div class="badge">Page Indépendante!</div></div>
<div class="card" onclick="location.href='chat.html'"><div style="font-size:24px">💬</div><b>CHAT ET Appels</b><span>Vocal, vidéo</span><div class="badge">Page Indépendante!</div></div>
<div class="card" onclick="location.href='fil.html'"><div style="font-size:24px">📰</div><b>Fil GMK</b><span>Fil d'actualité</span><div class="badge">NOUVEAU V3.8!</div></div>
<div class="card" onclick="location.href='ngos.html'"><div style="font-size:24px">🤝</div><b>NGOs CONNECT</b><span>ONG Afrique</span><div class="badge">Page Indépendante!</div></div>
</div>
<script>
function loadProfile(){
  var pic=localStorage.getItem('GMK_PROFILE_PIC');
  var name=localStorage.getItem('GMK_PROFILE_NAME')||'Chef';
  document.getElementById('pname').innerText=name;
  if(pic){document.getElementById('avatar').innerHTML='<img src="'+pic+'">';}
}
function saveProfile(input){
  var f=input.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(e){
    var data=e.target.result;
    localStorage.setItem('GMK_PROFILE_PIC',data);
    document.getElementById('avatar').innerHTML='<img src="'+data+'">';
    alert('Photo de profil mise Chef! ✅ Elle va apparaitre aussi dans tes posts pour tes 
abonnés!');
  };
  r.readAsDataURL(f);
}
loadProfile();
</script>
</body>
</html>
