<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion - GMK ARROW</title>
<style>
body{margin:0;font-family:Arial;background:#0A1931;color:white;display:flex;justify-content:center;align-items:center;min-height:100vh}
.card{background:#102542;border:2px solid #D4AF37;border-radius:20px;padding:25px;width:90%;max-width:400px;text-align:center}
.profil{width:90px;height:90px;background:#0A1931;border:2px solid #D4AF37;border-radius:50%;margin:0 auto 15px;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.profil img{width:100%;height:100%;object-fit:cover}
.title{font-size:26px;font-weight:900;color:#D4AF37}
.slogan{color:#D4AF37;font-size:12px;margin-bottom:18px}
.input-wrap{position:relative;margin:6px 0}
input{width:100%;padding:13px 45px 13px 13px;background:#0A1931;color:white;border:1px solid #D4AF37;border-radius:12px;box-sizing:border-box}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:18px}
button{width:100%;padding:13px;background:#D4AF37;color:#0A1931;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:10px}
a{color:#D4AF37;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="card">
<div class="profil" id="profilCircle" onclick="openGallery()"><span id="profilText">👤</span><img id="profilImg" style="display:none"></div>
<input type="file" id="fileInput" accept="image/*" style="display:none">
<div class="title">Content de te revoir Chef!</div>
<div class="slogan">Connecte-toi pour rejoindre la Communauté</div>
<div class="input-wrap"><input id="nom" placeholder="Ton nom"></div>
<div class="input-wrap"><input id="pass" type="password" placeholder="Mot de passe"><span class="eye" onclick="togglePass()">🙈</span></div>
<button onclick="seConnecter()">SE CONNECTER →</button>
<p><a href="register.html">Pas encore de compte? S'inscrire →</a></p>
</div>
<script>
window.onload = function(){
  const photo = localStorage.getItem('gmk_photo');
  const nom = localStorage.getItem('gmk_nom');
  if(photo){
    document.getElementById('profilImg').src = photo;
document.getElementById('profilImg').style.display='block';
    document.getElementById('profilText').style.display='none';
  }
  if(nom){ document.getElementById('nom').value = nom; }
}
function openGallery(){ document.getElementById('fileInput').click(); }
document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const base64 = ev.target.result;
    localStorage.setItem('gmk_photo', base64);
    document.getElementById('profilImg').src = base64;
    document.getElementById('profilImg').style.display='block';
    document.getElementById('profilText').style.display='none';
  }
  reader.readAsDataURL(file);
});
function togglePass(){
  const p = document.getElementById('pass');
  p.type = p.type === 'password'? 'text' : 'password';
}
function seConnecter(){
  const nom = document.getElementById('nom').value;
  if(nom) localStorage.setItem('gmk_nom', nom);
  localStorage.setItem('gmk_logged','true');
  window.location.href = 'carrefour.html';
}
</script>
</body>
</html>
