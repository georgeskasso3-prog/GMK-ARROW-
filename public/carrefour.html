<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrefour - GMK ARROW</title>
<style>
body{margin:0;font-family:Arial;background:#0A1931;color:white;padding:15px}
.header{display:flex;align-items:center;justify-content:space-between;background:#102542;border:2px solid #D4AF37;border-radius:15px;padding:10px 15px;margin-bottom:15px}
.profil{width:50px;height:50px;border-radius:50%;border:2px solid #D4AF37;overflow:hidden;display:flex;align-items:center;justify-content:center}
.profil img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#102542;border:2px solid #D4AF37;border-radius:18px;padding:18px;text-align:center;cursor:pointer}
.card h3{color:#D4AF37;margin:5px 0}
.card p{font-size:12px;opacity:0.8}
.badge{background:#D4AF37;color:#0A1931;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:900}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;align-items:center;gap:10px">
<div class="profil" id="profilCircle"><span id="profilText">👤</span><img id="profilImg" style="display:none"></div>
<div><b id="nomAffiche">Chef</b><br><small style="color:#D4AF37">Connecté</small></div>
</div>
<div style="color:#D4AF37;font-weight:900">GMK ARROW</div>
</div>
<div class="grid">
<div class="card" onclick="location.href='coach.html'"><div>🎯</div><h3>GMK COACH</h3><p>Coaching IA perso</p><span class="badge">Page indépendante!</span></div>
<div class="card" onclick="location.href='chat.html'"><div>💬</div><h3>CHAT ET Appels</h3><p>Parler, vocal, vidéo</p><span class="badge">Page indépendante!</span></div>
<div class="card" onclick="location.href='fil.html'"><div>📰</div><h3>Fil GMK</h3><p>Fil d'actualité</p><span class="badge">Page indépendante!</span></div>
<div class="card" onclick="location.href='ngos.html'"><div>🤝</div><h3>NGOs CONNECT</h3><p>ONG Afrique</p><span class="badge">Page indépendante!</span></div>
</div>
<script>
window.onload = function(){
  const photo = localStorage.getItem('gmk_photo');
  const nom = localStorage.getItem('gmk_nom');
  if(photo){
    document.getElementById('profilImg').src = photo;
    document.getElementById('profilImg').style.display='block';
    document.getElementById('profilText').style.display='none';
  }
  if(nom){
    document.getElementById('nomAffiche').innerText = nom;
  }
  if(!localStorage.getItem('gmk_logged')){
    // si pas connecté, renvoie au login
    // location.href='login.html';
  }
}
  /script>
</body>
</html>
