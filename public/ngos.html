<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NGO - GMK ARROW</title>
<style>
body{margin:0;font-family:Arial;background:#0A1931;color:white;padding:15px}
.header{display:flex;align-items:center;gap:10px;background:#102542;border:2px solid #D4AF37;border-radius:15px;padding:10px}
.profil{width:50px;height:50px;border-radius:50%;border:2px solid #D4AF37;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0A1931}
.profil img{width:100%;height:100%;object-fit:cover}
.btn{background:#D4AF37;color:#0A1931;border:none;padding:12px 20px;border-radius:10px;font-weight:900;cursor:pointer;margin-top:20px}
h2{color:#D4AF37}
</style></head><body>
<div class="header">
<div class="profil" id="profilCircle"><span id="profilText">👤</span><img id="profilImg" style="display:none"></div>
<b id="nomAffiche">Chef</b><span style="margin-left:auto;color:#D4AF37">GMK ARROW</span>
</div>
<h2>🤝 NGOs CONNECT</h2>
<p>Bienvenue Chef! Les ONG d'Afrique arrivent ici.</p>
<button class="btn" onclick="location.href='carrefour.html'">← Retour Carrefour</button>
<script>
window.onload=function(){
const p=localStorage.getItem('gmk_photo');const n=localStorage.getItem('gmk_nom');
if(p){document.getElementById('profilImg').src=p;document.getElementById('profilImg').style.display='block';document.getElementById('profilText').style.display='none';}
if(n)document.getElementById('nomAffiche').innerText=n;
}
</script></body></html>
